{{ define "main" }}
<article class="project-page">
  <p class="classification">Index · computational projects</p>
  <h1 class="project-title">Projects</h1>
  <div class="project-prose">
    <p>Twelve interactive computational-physics notebooks plus a chaotic-pendulum study, each with its own page, figures, and source.</p>
  </div>
  <section class="links-panel">
    <h2 class="links-head">All projects</h2>
    <ul class="links-list">
      {{ range (sort .Pages "Weight") }}
      <li><a href="{{ .RelPermalink }}"><span class="lk-label">{{ .Title }}</span><span class="lk-arrow">→</span></a></li>
      {{ end }}
    </ul>
  </section>
  <p class="project-back"><a href="/">← home</a></p>
</article>
{{ end }}
