# Cards on /coursework/, in display order.
#
# report, slides and code are paths inside ~/-uni, which is the source of truth.
# `python3 website/sync_uni.py` copies them into the site:
#   report -> static/pdfs/experiments/<slug>.pdf
#   slides -> static/pdfs/experiments/<slug>-slides.pdf
#   code   -> static/code/<slug>/<file name>   (linked on GitHub through the public mirror)
# Edit a report in ~/-uni, recompile it, run the sync, commit, deploy.

[[experiments]]
slug = "hall-effect"
title = "hall effect in semiconductors"
thumb = "/media/thumbs/hall.png"
alt = "Scanning Hall probe microscopy: Hall cross sensor and superconducting vortex lattice maps"
summary = "Measured Hall voltage and magnetoresistance across temperature to extract carrier type, mobility, and the intrinsic transition; includes uncertainty analysis."
report = "Sem3/pc2193-ep1/hall_effect/report/report.pdf"
code = [
  { label = "Analysis Code", src = "Sem3/pc2193-ep1/hall_effect/scripts/hall_effect_analysis.py" },
]

