# ---------------------------------------------------------------- PHY 474

[[reports]]
slug = "muon-lifetime"
report = "Sem5_exchange/phy474--advanced-lab-I/muon-lifetime/muon-lifetime-report.pdf"
summary = "Timed the decays of cosmic-ray muons stopped in lead glass. Two acquisitions that pass the shape and stability tests give τ = 2.19 ± 0.04 (stat.) ± 0.06 (syst.) µs, in agreement with the free-muon lifetime of 2.197 µs."

[[reports]]
slug = "mechanical-chaos"
report = "Sem5_exchange/phy474--advanced-lab-I/mechanical-chaos/mechanical-chaos-report.pdf"
slides = "Sem5_exchange/phy474--advanced-lab-I/mechanical-chaos/presentation/slides.pdf"
summary = "A driven spring pendulum as a Duffing-like oscillator. In the longest driven recording the angular spread at a fixed motor phase fell by a factor of 4.6 (95% interval 4.0–5.2), a resolved transition towards repeatable motion; noise and motor-speed drift prevent a unique attribution to deterministic chaos."

# ---------------------------------------------------------------- PC3193

[[reports]]
slug = "raman-spectroscopy"
report = "Sem4/pc3193-ep2/raman/report/report.pdf"
slides = "Sem4/pc3193-ep2/raman/raman_final.pdf"
summary = "Distinguished carbon allotropes by their D/G band ratios: HOPG shows no D band, the carbon rod D/G = 0.13 ± 0.02, nanotubes 1.24 ± 0.08. No diamond-like sample shows the diamond line, the graphene film is thicker than a monolayer, and the unknown wafer is silicon (520.9 ± 1.0 cm⁻¹)."

[[reports]]
slug = "xrf"
report = "Sem4/pc3193-ep2/xrf/report/report.pdf"
summary = "Identified the elements in brass, a magnetic sample and four Singapore coins, and measured the leaded brass as Cu (60 ± 3)%, Zn (37 ± 2)%, Pb (2.5 ± 0.9)% by mass by deconvolving overlapping K-lines."

[[reports]]
slug = "paschen-curve"
report = "Sem4/pc3193-ep2/plasma/report/report.pdf"
summary = "Breakdown voltage of air against electrode gap at 8, 6 and 4 hPa. At 8 hPa the minimum breakdown voltage is 416.8 ± 0.5 V, at pd = 0.764 ± 0.015 Pa·m; the two routes to the Townsend coefficient γ disagree, and the three pressures do not collapse onto one Paschen curve."

[[reports]]
slug = "laue-xrc"
report = "Sem4/pc3193-ep2/lau+xrc/report/report.pdf"
summary = "Laue back-reflection of LiF, orientation in drawn polyethylene, and powder diffraction of two unknowns: diamond-cubic silicon, a = 5.4311(2) Å, and BCC molybdenum, a = 3.1480(13) Å, with strong {100} preferred orientation."

[[reports]]
slug = "trim-simulation"
report = "Sem4/pc3193-ep2/trim/report/report.pdf"
summary = "Monte Carlo (TRIM) simulations of ion ranges, damage and sputtering for six applied problems, from 1 GeV protons in air to placing a proton Bragg peak in a brain tumour."

# ---------------------------------------------------------------- PC3267

[[reports]]
slug = "fluorescence-spectroscopy"
report = "Sem4/pc3267-bp2/bio-fluorescence/report/report.pdf"
summary = "Acid denaturation of BSA and lysozyme followed by intrinsic Trp/Tyr fluorescence: in acid BSA loses (23.6 ± 0.4)% of its intensity with a (19 ± 2) nm blue shift, while lysozyme loses (28.0 ± 0.4)% with no measurable shift."

[[reports]]
slug = "circular-dichroism"
report = "Sem4/pc3267-bp2/bio-cd/report/report.pdf"
summary = "Far-UV circular dichroism of BSA and lysozyme under acid: BSA's helix bands weaken by (21.4 ± 0.3)% at the minimum and (23.1 ± 0.3)% at 222 nm, while lysozyme's minimum changes by only (1.0 ± 0.7)%."

[[reports]]
slug = "fluorescence-microscopy"
report = "Sem4/pc3267-bp2/bio-microscopy/report/report.pdf"
summary = "Brightfield and Hoechst fluorescence imaging of onion epidermal and cheek epithelial cells: cell dimensions, nuclear sizes (about 29 µm in onion, 8 µm in cheek cells) and nuclear contrast."

# ---------------------------------------------------------------- IT1244

[[reports]]
slug = "term-deposit-prediction"
title = "Predicting Term-Deposit Subscription Before the Call: Leakage-Free Models and Cost-Aware Thresholds"
report = "Sem4/it1244-ai/it1244/report/report.pdf"
summary = "Predicts term-deposit subscription from features known before the call, dropping call duration, which leaks the outcome. Logistic regression, LightGBM and an MLP reach ROC AUC 0.784, and LightGBM has the best PR-AUC (0.450). A cost-based threshold calls 41.5% of clients, reaches 76% of subscribers and saves 15% against calling everyone."

# ---------------------------------------------------------------- PC3236

[[reports]]
slug = "driven-quadruple-pendulum"
report = "Sem4/pc3236-cmp1/pc3236/report/report.pdf"
summary = "A driven, damped chain of four pendulums, solved with a self-written fourth-order Runge–Kutta integrator. The largest Lyapunov exponent at the nominal drive is (1.03 ± 0.02) s⁻¹, so the motion is chaotic and trajectories are reliable only for about 20 s; the response runs from periodic, through quasi-periodic, to chaotic above 6.55 N m."

# ---------------------------------------------------------------- PC2193

[[reports]]
slug = "hall-effect"
report = "Sem3/pc2193-ep1/hall_effect/report/report.pdf"
summary = "Hall voltage and magnetoresistance of n- and p-type germanium: carrier densities of 6.25 × 10²⁰ and 8.60 × 10²⁰ m⁻³ and Hall mobilities of 0.363 and 0.287 m² V⁻¹ s⁻¹; the p-type Hall voltage reverses sign at 105.2 °C as intrinsic conduction takes over."

[[reports]]
slug = "xrd"
report = "Sem3/pc2193-ep1/xrd/report/report.pdf"
summary = "Bragg spectra of a Cu tube identify the unknown crystal as KBr, a = (6.604 ± 0.002) Å; the 25 kV bremsstrahlung cut-off gives Planck's constant h = (6.35 ± 0.15) × 10⁻³⁴ J s."

[[reports]]
slug = "magnetic-moment"
report = "Sem3/pc2193-ep1/magnetic_moment/report/report.pdf"
slides = "Sem3/pc2193-ep1/magnetic_moment/slides/mm.pdf"
summary = "Torque on current loops in a Helmholtz field: the field constant c = (7.03 ± 0.11) × 10⁻⁴ T A⁻¹ from five sweeps, in agreement with the coil formula, and an effective area of (106 ± 3) cm² for a star-shaped loop."

[[reports]]
slug = "esr"
title = "Electron Spin Resonance"
report = "Sem3/pc2193-ep1/ExpA_ESR_ParthBhargava_v2.pdf"
summary = "Extracted the electron g-factor from resonance frequency against magnetic field; Zeeman splitting and systematics."

[[reports]]
slug = "pll"
title = "Propagation of Laser Light"
report = "Sem3/pc2193-ep1/ExpB_PLL_ParthBhargava.pdf"
summary = "Measured Gaussian beam parameters and beam quality of a laser, with emphasis on fitting and measurement limits."
