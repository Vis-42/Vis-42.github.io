# The /coursework/ page: courses in display order, then the reports.
#
# A report is listed under the course whose `folder` its `report` path starts with.
# `kind` groups the courses on the page: "Experimental work" or "Projects".
# Paths are inside ~/-uni, the source of truth. `uv run website/sync_uni.py` copies
# the committed PDFs into the site and reads each one's title and page count:
#   report -> static/pdfs/experiments/<slug>.pdf
#   slides -> static/pdfs/experiments/<slug>-slides.pdf
#
# New report: add a [[reports]] entry (slug, report, summary; slides if any), run the
# sync, commit, deploy. `title` is only needed when the PDF has no title of its own.

